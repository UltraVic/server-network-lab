# /etc/nginx/sites-available/notes.conf (하드닝 적용본).
# rate-limit · 타임아웃 · 바디크기 · 보안헤더 + 자체서명 HTTPS. 자세히: docs §17.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {                                    # HTTP → HTTPS 리다이렉트
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {                                    # HTTPS
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    root /srv/notes/current/frontend;
    index index.html;

    client_max_body_size 1m;                # 거대 요청 차단
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/login {                  # 로그인: 무차별 대입 방어(분당 10 + 버스트5)
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {                         # 일반 API
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                 # SSE
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;              # SSE 스트림 여유
        proxy_send_timeout 60s;
    }
}
