# /etc/prometheus/prometheus.yml — 15초마다 자기 자신 + notes-api(/metrics) 스크랩.
# notes-api 는 nginx 거치지 않고 127.0.0.1:8000 직접(루프백) 스크랩 = rate-limit/외부노출 무관.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: notes-api
    static_configs:
      - targets: ['127.0.0.1:8000']
