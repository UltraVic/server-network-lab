# Alembic 설정 — DB 스키마 마이그레이션.
#  · sqlalchemy.url 은 여기 두지 않는다(시크릿). env.py 가 .env 의 DATABASE_URL 에서 주입.
#  · script_location 은 %(here)s 기준이라 어느 디렉터리에서 실행해도 동작(deploy.sh 가 -c 로 호출).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
