name: deploy

# main 에 push 될 때만. (fork PR 로는 안 돎 → public+self-hosted 위험 완화)
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ── CI 게이트: 테스트가 통과해야만 배포 ──
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: pytest (인증/보안 단위 테스트)
        working-directory: backend
        run: |
          rm -rf /tmp/ci-venv
          python3 -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install -q -r requirements.txt pytest
          /tmp/ci-venv/bin/pytest -q

  deploy:
    needs: test            # ← test 통과해야만 실행 (실패하면 배포 차단)
    runs-on: self-hosted
    steps:
      # checkout 불필요 — deploy.sh 가 /srv/notes/repo.git 에서 직접 fetch.
      - name: 무중단 배포 실행
        run: /srv/notes/deploy.sh
