# Nginx 리버스 프록시 — Phase 2~3 핵심.
#
# 역할:
#   1) /        → 프론트 정적 파일 서빙
#   2) /api/    → 백엔드(FastAPI)로 전달 (proxy_pass)
#
# 효과:
#   - 브라우저는 오직 이 서버(한 출처)만 본다 → CORS 불필요
#   - 백엔드는 이 프록시를 통해서만 닿는다 → 백엔드 포트를 외부에 안 열어도 됨
#     (Atomytics의 Next rewrites 와 같은 역할을, 여기선 Nginx로 명시적으로)

server {
    listen 80;

    # 1) 프론트 정적 파일
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2) API 프록시
    #    /api/notes  →  http://backend:8000/notes
    #    ('backend' 은 docker-compose 서비스명 = 내부 DNS)
    location /api/ {
        proxy_pass http://backend:8000/;   # 끝의 / 가 /api 접두어를 떼고 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE(Phase 6): 스트리밍 응답이 버퍼링에 갇히지 않게 끈다.
        # 이 한 줄(프록시 측 해법) + 백엔드의 X-Accel-Buffering: no(앱 측 해법)로
        # nginx 설정·중간 프록시와 무관하게 실시간 스트리밍을 보장한다.
        proxy_buffering off;
    }
}
